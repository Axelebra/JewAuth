plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

// Minecraft 26.1+ is shipped UN-obfuscated, so Loom uses Mojang official
// mappings by default. There is no `mappings` dependency and no Yarn — that is
// the whole point of the 1.21.11 -> 26.x migration. Mixins resolve names
// directly against the mapped jar, so no legacy mixin AP / refmap is needed.

repositories {
    // No extra repos needed — Netty is on Maven Central via Fabric/MC
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // No mappings line: officialMojangMappings() is the default for 26.x.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Netty proxy handlers (SOCKS4, SOCKS5, HTTP CONNECT)
    // These are NOT bundled with Minecraft's Netty — we JiJ them into the mod.
    // Version must match the Netty version Minecraft 26.2 ships (netty 4.2.15.Final).
    implementation "io.netty:netty-handler-proxy:4.2.15.Final"
    include       "io.netty:netty-handler-proxy:4.2.15.Final"
    implementation "io.netty:netty-codec-socks:4.2.15.Final"
    include       "io.netty:netty-codec-socks:4.2.15.Final"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    // 26.x is unobfuscated, so Loom does no remapping and `jar` is the final
    // artifact. Classifier names it JewAuth-<mod_version>-<minecraft_version>.jar
    archiveClassifier = project.minecraft_version
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
